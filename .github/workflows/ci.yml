name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Check out uniqdiff
        uses: actions/checkout@v4
        with:
          repository: Hweded/uniqdiff
          path: uniqdiff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff mypy

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy packages/uniqrowdiff/src packages/uniqcheck/src
        env:
          PYTHONPATH: uniqdiff/src:packages/uniqrowdiff/src:packages/uniqcheck/src

      - name: Test
        run: python -m pytest
        env:
          PYTHONPATH: uniqdiff/src:packages/uniqrowdiff/src:packages/uniqcheck/src
